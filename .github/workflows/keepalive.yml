name: Aiven keep-alive

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)
  workflow_dispatch:         # permite rodar manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta no MySQL
        env:
          MYSQL_PWD: ${{ secrets.AIVEN_PASSWORD }}
        run: |
          mysql --host="${{ secrets.AIVEN_HOST }}" \
                --port="${{ secrets.AIVEN_PORT }}" \
                --user="${{ secrets.AIVEN_USER }}" \
                --ssl-mode=REQUIRED \
                "${{ secrets.AIVEN_DB }}" \
                -e "SELECT 1; SELECT NOW();"
